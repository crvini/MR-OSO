[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

# Redirige /api/chat al Netlify Function para que el frontend no cambie
[[redirects]]
  from   = "/api/chat"
  to     = "/.netlify/functions/chat"
  status = 200

# SPA fallback para react-router
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
